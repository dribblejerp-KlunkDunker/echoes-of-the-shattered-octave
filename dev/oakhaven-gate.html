<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oakhaven gate frame pilot</title>
<style>body{margin:0;background:#182027;color:#eee;font:16px sans-serif}header{padding:10px}iframe{width:100%;height:85vh;border:0}</style>
<header>Developer preview: frame-only pilot, not finished art. <button id="toggle" disabled>Enable frame</button> <span id="status">Loading game...</span></header>
<iframe id="game" src="../index.html" title="Disposable game preview"></iframe>
<script>
const frame=document.getElementById('game'),button=document.getElementById('toggle'),status=document.getElementById('status');let enabled=false;
frame.addEventListener('load',()=>{const d=frame.contentDocument,s=d.createElement('script');s.src='js/oakhaven-gate-frame.js?v=1';s.onload=()=>{if(!frame.contentWindow.OAK_GATE_FRAME){status.textContent='R3D unavailable; pilot not installed.';return;}button.disabled=false;status.textContent='Begin a fresh game and visit Oakhaven. The old gate remains unchanged.';};s.onerror=()=>{status.textContent='Patch module failed to load.';};d.body.appendChild(s);});
button.onclick=()=>{enabled=!enabled;frame.contentWindow.OAK_GATE_FRAME.setEnabled(enabled);button.textContent=enabled?'Disable frame':'Enable frame';};
</script></html>
