name: Desktop packages

# Builds the Electron shell on each OS's native runner. Runs on a version tag or by hand.
# No secrets are needed to run: without them the packages are simply unsigned.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: windows
            runner: windows-latest
            script: dist:win
            artifact_glob: |
              desktop/dist/*.exe
          - os_name: macos
            runner: macos-latest
            script: dist:mac
            artifact_glob: |
              desktop/dist/*.dmg
          - os_name: linux
            runner: ubuntu-latest
            script: dist:linux
            artifact_glob: |
              desktop/dist/*.AppImage
              desktop/dist/*.deb
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
      - name: Static checks
        working-directory: .
        run: node test/desktop.test.js
      - name: Install
        run: npm ci || npm install
      # Signing is gated on secrets. electron-builder signs automatically when these env vars are present.
      - name: Package (Windows)
        if: matrix.os_name == 'windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}
        run: npm run ${{ matrix.script }}
      - name: Package (macOS)
        if: matrix.os_name == 'macos'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.script }}
      - name: Package (Linux)
        if: matrix.os_name == 'linux'
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: desktop-${{ matrix.os_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --draft --title "${{ github.ref_name }}" --notes "Unsigned unless signing secrets were configured. See docs/desktop.md."
